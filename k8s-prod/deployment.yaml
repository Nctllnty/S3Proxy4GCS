apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3proxy
  namespace: s3proxy-e2e
  annotations:
    iam.gke.io/gcp-service-account: s3proxy-test@robust-charge-495605-g4.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3proxy
  namespace: s3proxy-e2e
  labels:
    app: s3proxy
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: s3proxy
  template:
    metadata:
      labels:
        app: s3proxy
        environment: production
    spec:
      serviceAccountName: s3proxy
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: s3proxy
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: s3proxy
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: cloud.google.com/gke-nodepool
                    operator: In
                    values:
                      - c4d-pool
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: s3proxy
                topologyKey: topology.kubernetes.io/zone
            - weight: 90
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: s3proxy
                topologyKey: kubernetes.io/hostname
      containers:
        - name: s3proxy
          image: us-east1-docker.pkg.dev/robust-charge-495605-g4/s3proxy/s3proxy:a6cd0153efc234a76a8ef21b8c4d08d0e47f507a
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: GCP_PROJECT_ID
              value: "robust-charge-495605-g4"
            - name: GCS_PREFIX
              value: ""
            - name: DRY_RUN
              value: "false"
            - name: DEBUG_LOGGING
              value: "false"
            - name: MAX_IDLE_CONNS
              value: "1000"
            - name: MAX_IDLE_CONNS_PER_HOST
              value: "1000"
            - name: MAX_CONCURRENT_REQUESTS
              value: "1000"
            - name: GCS_CALL_TIMEOUT_SEC
              value: "30"
            - name: HMAC_CREDENTIALS_FILE
              value: /etc/s3proxy/credentials.json
            - name: HMAC_STRICT
              value: "true"
            - name: REQUEST_LOG_ENABLED
              value: "true"
            - name: REQUEST_LOG_PATH
              value: "/var/log/s3proxy/req_%Y%M%D.csv"
            - name: REQUEST_LOG_MAX_SIZE_MB
              value: "512"
            - name: REQUEST_LOG_MAX_BACKUP
              value: "5"
            - name: REQUEST_LOG_CHAN_BUF
              value: "10240"
            - name: REQUEST_LOG_KEEP_DAYS
              value: "7"
          volumeMounts:
            - name: log-volume
              mountPath: /var/log/s3proxy
            - name: hmac-credentials
              mountPath: /etc/s3proxy
              readOnly: true
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: log-volume
          emptyDir: {}
        - name: hmac-credentials
          secret:
            secretName: s3proxy-hmac-credentials
            items:
              - key: credentials.json
                path: credentials.json
