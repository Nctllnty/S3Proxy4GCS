apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: s3proxy
  namespace: s3proxy-e2e
  labels:
    app: s3proxy
    environment: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: s3proxy
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
