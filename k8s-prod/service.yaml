apiVersion: v1
kind: Service
metadata:
  name: s3proxy
  namespace: s3proxy-e2e
  labels:
    app: s3proxy
    environment: production
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  selector:
    app: s3proxy
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: http-direct
      port: 8080
      targetPort: 8080
      protocol: TCP
