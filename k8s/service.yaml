apiVersion: v1
kind: Service
metadata:
  name: s3proxy
  namespace: s3proxy-e2e
  labels:
    app: s3proxy
  annotations:
    # L4 Internal Load Balancer (TCP passthrough) — lowest latency,
    # no HTTP parsing overhead.  Exposes a stable VPC-internal VIP
    # that SDK clusters can reach via Cloud DNS private zone.
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  selector:
    app: s3proxy
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
