# PrometheusRule for s3proxy4gcs.
#
# These alerts codify the baseline SLOs described in docs/SLO.md:
#   * Data-plane availability  >= 99.9%    (5xx rate alert @ 0.5%)
#   * Data-plane tail latency  P99 < 1s    (get_object / put_object)
#   * Control-plane stability  No 5xx      (lifecycle/cors/logging/website/tagging)
#   * Throttle saturation      In-flight   (concurrency limiter headroom)
#   * GCS backend health       SDK errors  (control-plane GCS SDK failures)
#   * HMAC credential mapping  (v1.7+)     (store populated, miss rate low,
#                                           hot-reload succeeds)
#
# Labels mirror the ServiceMonitor (namespace s3proxy-e2e, app s3proxy) so
# alerts route to the same team that owns the proxy.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: s3proxy-rules
  namespace: s3proxy-e2e
  labels:
    app: s3proxy
    # Matches the kube-prometheus-stack Prometheus CR default selector.
    release: monitoring
spec:
  groups:
    - name: s3proxy.slo
      interval: 30s
      rules:
        # --- Data-plane availability -----------------------------------
        - alert: S3ProxyDataPlane5xxRateHigh
          expr: |
            sum by (endpoint) (
              rate(s3proxy_gcs_errors_total{endpoint=~"get_object|put_object|head_object|delete_object|list_objects|delete_objects", status_class="5xx"}[5m])
            )
            /
            sum by (endpoint) (
              rate(s3proxy_http_requests_total{endpoint=~"get_object|put_object|head_object|delete_object|list_objects|delete_objects"}[5m])
            )
            > 0.005
          for: 5m
          labels:
            severity: critical
            slo: data-plane-availability
          annotations:
            summary: "S3Proxy data-plane 5xx > 0.5% on {{ $labels.endpoint }}"
            description: |
              More than 0.5% of requests on `{{ $labels.endpoint }}` returned 5xx
              for 5 consecutive minutes. Check `s3proxy_gcs_errors_total` by
              endpoint + status_class, and upstream GCS status.
            runbook: https://github.com/s3proxy4gcs/runbooks/5xx.md

        # --- Data-plane tail latency -----------------------------------
        - alert: S3ProxyDataPlaneP99Slow
          expr: |
            histogram_quantile(
              0.99,
              sum by (le, endpoint) (
                rate(s3proxy_http_request_duration_seconds_bucket{endpoint=~"get_object|put_object"}[10m])
              )
            ) > 1
          for: 10m
          labels:
            severity: warning
            slo: data-plane-latency
          annotations:
            summary: "S3Proxy P99 latency > 1s on {{ $labels.endpoint }}"
            description: |
              P99 latency for `{{ $labels.endpoint }}` has exceeded 1s for
              10 minutes. Inspect SigV4 overhead (`s3proxy_resign_duration_seconds`),
              GCS latency (`s3proxy_gcs_api_duration_seconds`), and pod CPU throttling.

        # --- Control-plane GCS SDK failures ----------------------------
        - alert: S3ProxyControlPlaneGCSErrors
          expr: |
            sum by (operation, status_class) (
              rate(s3proxy_gcs_errors_total{status_class=~"5xx|timeout|network"}[5m])
            ) > 0
          for: 5m
          labels:
            severity: warning
            slo: control-plane-availability
          annotations:
            summary: "S3Proxy control-plane errors on {{ $labels.operation }} ({{ $labels.status_class }})"
            description: |
              SDK calls for `{{ $labels.operation }}` are failing with
              `{{ $labels.status_class }}`. Most common causes: GCS regional
              outage, HMAC key rotation, or IAM binding drift.

        # --- Throttle saturation ---------------------------------------
        - alert: S3ProxyThrottleSaturated
          expr: |
            sum by (pod) (s3proxy_in_flight_requests)
            /
            scalar(max(s3proxy_in_flight_requests) or vector(1000))
            > 0.8
          for: 2m
          labels:
            severity: warning
            slo: capacity
          annotations:
            summary: "S3Proxy in-flight >80% of throttle ceiling"
            description: |
              In-flight requests are saturating the concurrency limiter.
              Scale replicas via HPA or bump MAX_CONCURRENT_REQUESTS after
              verifying that long-running PUT streams are not monopolizing slots.

        # --- Proxy process health --------------------------------------
        - alert: S3ProxyInstanceDown
          expr: up{job=~"s3proxy.*"} == 0
          for: 2m
          labels:
            severity: critical
            slo: availability
          annotations:
            summary: "S3Proxy scrape target down"
            description: |
              Prometheus cannot scrape `/metrics` for 2 minutes. Check the pod
              (liveness probe, OOMKill), node, and ServiceMonitor selector.

        # --- HMAC credential store empty (v1.7+) -----------------------
        # A pod with zero entries rejects every client request with
        # InvalidAccessKeyId. This is almost always caused by a bad
        # Secret rollout (malformed JSON, missing `credentials.json`
        # key, or the volume not mounting) and never by a legitimate
        # deployment, so the alert is wired straight to pager.
        - alert: S3ProxyHMACCredentialsEmpty
          expr: s3proxy_hmac_credentials_loaded == 0
          for: 2m
          labels:
            severity: critical
            slo: credential-mapping
          annotations:
            summary: "S3Proxy credential map is empty — all clients blocked"
            description: |
              `s3proxy_hmac_credentials_loaded` has been 0 for 2 minutes on
              `{{ $labels.pod }}`. Verify the mounted Secret with:
                kubectl -n s3proxy-e2e get secret s3proxy-hmac-credentials \
                  -o jsonpath='{.data.credentials\.json}' | base64 -d | jq .
              Until fixed, every request returns 403 InvalidAccessKeyId.
            runbook: docs/SLO.md#related-runbooks

        # --- HMAC credential miss rate (v1.7+) -------------------------
        # Two fault classes both surface here:
        #   1. A legitimate client is signing with a stale AK after
        #      rotation (fix: re-run scripts/create-client-hmac.sh, tell
        #      the tenant to refresh).
        #   2. A scanner is probing the endpoint with random AKs
        #      (fix: correlate with reqlog source IP, block at NetworkPolicy).
        # Either way a sustained >5% miss rate wants a human.
        - alert: S3ProxyHMACCredentialMissHigh
          expr: |
            sum(rate(s3proxy_hmac_credential_lookups_total{result="miss"}[5m]))
            /
            sum(rate(s3proxy_hmac_credential_lookups_total{result=~"hit|miss|no_auth"}[5m]))
            > 0.05
          for: 5m
          labels:
            severity: warning
            slo: credential-mapping
          annotations:
            summary: "S3Proxy HMAC credential miss rate > 5%"
            description: |
              More than 5% of SigV4 credential lookups are missing in the
              map over the last 5m. Either a client has stale credentials
              after a rotation or the proxy is being scanned. Correlate the
              source IPs in the reqlog CSV and cross-check Secret contents.

        # --- HMAC credential hot-reload errors (v1.7+) -----------------
        # A non-zero reload error means fsnotify fired but strict JSON
        # validation failed. The in-memory snapshot is retained so the
        # pod keeps serving — do NOT restart until the Secret is fixed,
        # otherwise the new pod will boot with an empty map and trip
        # S3ProxyHMACCredentialsEmpty.
        - alert: S3ProxyHMACCredentialReloadFailed
          expr: increase(s3proxy_hmac_credentials_reload_total{result="error"}[5m]) > 0
          for: 5m
          labels:
            severity: warning
            slo: credential-mapping
          annotations:
            summary: "S3Proxy HMAC credentials hot-reload failed"
            description: |
              `fsnotify` observed a Secret update but the new payload
              failed `pkg/credstore.parse` validation. The previous
              snapshot is still active; fix the Secret JSON before
              rolling the deployment, otherwise the pod will come up
              with zero credentials loaded.
