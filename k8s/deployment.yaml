apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3proxy
  namespace: s3proxy-e2e
  annotations:
    iam.gke.io/gcp-service-account: s3proxy-test@cbs-poctest.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3proxy
  namespace: s3proxy-e2e
  labels:
    app: s3proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3proxy
  template:
    metadata:
      labels:
        app: s3proxy
    spec:
      serviceAccountName: s3proxy
      # S3Proxy must run only on service node pools, never on benchmark-only pool.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: cloud.google.com/gke-nodepool
                    operator: In
                    values:
                      - c3d-pool
                      - c4d-pool
        # Prefer s3proxy and benchmark pods on different nodes, but allow
        # co-location when node capacity is limited (e.g. single-node pools).
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: benchmark
                topologyKey: kubernetes.io/hostname
      containers:
        - name: s3proxy
          # Image tag is updated by CI via: kubectl set image deployment/s3proxy s3proxy=IMAGE
          image: us-east1-docker.pkg.dev/cbs-poctest/s3proxy/s3proxy:initial
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: GCP_PROJECT_ID
              value: "cbs-poctest"
            - name: TARGET_BUCKET
              valueFrom:
                secretKeyRef:
                  name: s3proxy-config
                  key: TARGET_BUCKET
            - name: GCS_PREFIX
              value: "s3proxy-test/"
            - name: DRY_RUN
              value: "false"
            # DEBUG_LOGGING prints request headers (including signed Authorization
            # metadata) for every request. Must remain "false" in production.
            # Set to "true" temporarily only when diagnosing signature issues.
            - name: DEBUG_LOGGING
              value: "false"
            - name: MAX_IDLE_CONNS
              value: "1000"
            - name: MAX_IDLE_CONNS_PER_HOST
              value: "1000"
            - name: MAX_CONCURRENT_REQUESTS
              value: "1000"
            - name: GCS_CALL_TIMEOUT_SEC
              value: "30"
            - name: PROXY_BASE_DOMAIN
              value: "s3proxy.lb.local"
            # ---- SDK Compatibility Experiment (branch: test/disable-header-strip) ----
            # When true, the Director forwards SDK-diagnostic headers
            # (Amz-Sdk-Invocation-Id, Amz-Sdk-Request, Accept-Encoding,
            # X-Amz-Decoded-Content-Length, X-Amz-Trailer, aws-chunked
            # Content-Encoding) to GCS untouched. Expect 403 on most AWS
            # SDK v2 flavours. MUST remain "false" on main.
            - name: DISABLE_HEADER_STRIP
              value: "true"
            # ---- HMAC Credential Mapping (v1.7+) ----
            # The proxy re-signs each request with the client's own GCS HMAC
            # key pair. The mapping lives in the `s3proxy-hmac-credentials`
            # Secret (key: credentials.json). Rotate by running
            # `scripts/create-client-hmac.sh` and applying the new Secret;
            # fsnotify picks up the kubelet symlink swap within seconds, no
            # pod restart required. See docs/hmac-credential-mapping-design.md.
            - name: HMAC_CREDENTIALS_FILE
              value: /etc/s3proxy/credentials.json
            - name: HMAC_STRICT
              value: "true"
            # ---- Request Log System ----
            - name: REQUEST_LOG_ENABLED
              value: "true"
            - name: REQUEST_LOG_PATH
              value: "/var/log/s3proxy/req_%Y%M%D.csv"
            - name: REQUEST_LOG_MAX_SIZE_MB
              value: "512"
            - name: REQUEST_LOG_MAX_BACKUP
              value: "5"
            - name: REQUEST_LOG_CHAN_BUF
              value: "10240"
            - name: REQUEST_LOG_KEEP_DAYS
              value: "7"
          volumeMounts:
            - name: log-volume
              mountPath: /var/log/s3proxy
            - name: hmac-credentials
              mountPath: /etc/s3proxy
              readOnly: true
          resources:
            # Guaranteed QoS: requests == limits to avoid CPU throttling
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: log-volume
          emptyDir: {}
        - name: hmac-credentials
          secret:
            secretName: s3proxy-hmac-credentials
            # Kubernetes updates Secret volume mounts atomically via the
            # `..data` symlink. fsnotify in pkg/credstore watches the parent
            # directory so hot-reload works without any further tweaks.
            items:
              - key: credentials.json
                path: credentials.json
