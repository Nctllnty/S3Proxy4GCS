# Direct GCS Native SDK Benchmark Job.
# Uses the native Google Cloud Storage Go SDK directly against GCS,
# bypassing the S3Proxy entirely. Auth via GKE Workload Identity.
apiVersion: batch/v1
kind: Job
metadata:
  name: direct-benchmark
  namespace: s3proxy-e2e
  labels:
    app: direct-benchmark
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: direct-benchmark
    spec:
      serviceAccountName: s3proxy
      nodeSelector:
        cloud.google.com/gke-nodepool: benchmark-c4-pool-new
      restartPolicy: Never
      containers:
        - name: benchmark
          image: us-east1-docker.pkg.dev/cbs-poctest/s3proxy/s3proxy-benchmark:latest
          args:
            - "-test.v"
            - "-test.count=1"
            - "-test.timeout=90m"
            - "-test.run=TestDirectGCSBenchmark"
          env:
            # BENCH_MODE=direct: skip proxy health check, use native GCS SDK
            - name: BENCH_MODE
              value: "direct"
            # TEST_BUCKET is no longer passed in: e2e_tests/framework.go hard-codes
            # `s3proxy-e2e-test` (see AGENTS.md).
            - name: TEST_PREFIX
              value: "direct-bench/"
            - name: BENCH_CONCURRENCY
              value: "10"
            - name: BENCH_DURATION_SEC
              value: "30"
            - name: BENCHMARK_NODE_POOL
              value: "benchmark-c4-pool-new"
            # HMAC credentials required for AWS SDK Go v2 → GCS S3-compatible API
            - name: GCS_HMAC_ACCESS
              valueFrom:
                secretKeyRef:
                  name: s3proxy-hmac-credentials
                  key: hmac-access
            - name: GCS_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: s3proxy-hmac-credentials
                  key: hmac-secret
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
