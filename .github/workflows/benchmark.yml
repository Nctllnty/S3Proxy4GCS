name: Performance Benchmark (In-Cluster)

on:
  workflow_dispatch:
    inputs:
      proxy_node_pool:
        description: 'Node pool for S3Proxy (c3d-pool or c4d-pool)'
        required: false
        default: 'c3d-pool'
        type: choice
        options:
          - c3d-pool
          - c4d-pool
      concurrency:
        description: 'Number of concurrent goroutines'
        required: false
        default: '50'
        type: string
      duration_sec:
        description: 'Duration per benchmark in seconds'
        required: false
        default: '30'
        type: string

env:
  GKE_CLUSTER: s3proxy-e2e
  GKE_REGION: us-east1
  GAR_REGISTRY: us-east1-docker.pkg.dev/cbs-poctest/s3proxy
  K8S_NAMESPACE: s3proxy-e2e

# Only one benchmark at a time — parallel runs share the same K8s
# deployment/service/job and would corrupt each other's results.
concurrency:
  group: benchmark-exclusive
  cancel-in-progress: false

jobs:
  benchmark:
    name: Build, Deploy & In-Cluster Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # ---- GCP Auth ----
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      # ---- Multi-arch Build Setup ----
      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---- Build & Push S3Proxy Image (multi-arch) ----
      - name: Build and Push S3Proxy Image
        run: |
          IMAGE="${{ env.GAR_REGISTRY }}/s3proxy:${{ steps.meta.outputs.tag }}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE" \
            --push .

      # ---- Build & Push Benchmark Image (multi-arch) ----
      - name: Build and Push Benchmark Image
        run: |
          IMAGE="${{ env.GAR_REGISTRY }}/s3proxy-benchmark:${{ steps.meta.outputs.tag }}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE" \
            --file e2e_tests/Dockerfile \
            --push e2e_tests/

      # ---- Deploy S3Proxy to GKE ----
      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
            --region ${{ env.GKE_REGION }} --project cbs-poctest

      - name: Deploy S3Proxy
        run: |
          PROXY_POOL="${{ inputs.proxy_node_pool }}"
          IMAGE="${{ env.GAR_REGISTRY }}/s3proxy:${{ steps.meta.outputs.tag }}"
          kubectl apply -f k8s/namespace.yaml
          # v1.7+: benchmark harness signs with the same HMAC AK/SK, so
          # we register it as a single-tenant map in the hot-reload
          # Secret. See docs/hmac-credential-mapping-design.md.
          CREDENTIALS_JSON="$(jq -cn --arg ak "${{ secrets.GCS_HMAC_ACCESS }}" \
            --arg sk "${{ secrets.GCS_HMAC_SECRET }}" '{($ak): $sk}')"
          kubectl create secret generic s3proxy-hmac-credentials \
            --from-literal=credentials.json="${CREDENTIALS_JSON}" \
            -n ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          # s3proxy-config Secret no longer carries TARGET_BUCKET: the proxy
          # runs in multi-tenant mode (bucket parsed per-request from URL) and
          # the benchmark harness hard-codes `s3proxy-e2e-test`.

          # Pin S3Proxy to the selected node pool (single-value nodeAffinity).
          # Use placeholder to avoid sed deleting the line we just wrote
          # when PROXY_POOL equals "c4d-pool".
          sed 's/- c3d-pool/- __POOL__/' k8s/deployment.yaml | \
            sed '/- c4d-pool/d' | \
            sed 's/__POOL__/'"$PROXY_POOL"'/' | \
            kubectl apply -f -

          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml 2>/dev/null || true
          kubectl set image deployment/s3proxy s3proxy="$IMAGE" -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/s3proxy -n ${{ env.K8S_NAMESPACE }} --timeout=120s

      # ---- ClusterIP Health Check ----
      - name: Verify S3Proxy Health (ClusterIP)
        run: |
          kubectl rollout status deployment/s3proxy -n ${{ env.K8S_NAMESPACE }} --timeout=120s

          kubectl run health-check --rm -i --restart=Never \
            -n ${{ env.K8S_NAMESPACE }} \
            --image=curlimages/curl:latest \
            -- curl -sf --retry 3 --retry-delay 5 --max-time 10 http://s3proxy:8080/readyz
          echo "S3Proxy is healthy via ClusterIP"

      # ---- Run Benchmark as K8s Job ----
      - name: Run Benchmark Job (ClusterIP direct)
        run: |
          BENCH_IMAGE="${{ env.GAR_REGISTRY }}/s3proxy-benchmark:${{ steps.meta.outputs.tag }}"

          # Delete any previous benchmark job
          kubectl delete job benchmark -n ${{ env.K8S_NAMESPACE }} --ignore-not-found
          sleep 2

          # Fixed benchmark client pool for fair A/B comparison.
          # Using a dedicated pool ensures identical client hardware
          # regardless of which proxy pool is under test.
          PROXY_POOL="${{ inputs.proxy_node_pool }}"
          BENCH_POOL="benchmark-c4-pool-new"
          echo "S3Proxy -> $PROXY_POOL | Benchmark -> $BENCH_POOL (fixed)"

          # Generate the job manifest with correct image, node pool, and parameters
          sed -e "s|image: .*s3proxy-benchmark:.*|image: ${BENCH_IMAGE}|" \
              -e "s|value: \"50\"|value: \"${{ inputs.concurrency }}\"|" \
              -e 's|value: "bench-incluster/"|value: "bench-${{ github.run_id }}/"|' \
              -e "s|cloud.google.com/gke-nodepool: benchmark-c4-pool-new|cloud.google.com/gke-nodepool: ${BENCH_POOL}|" \
              -e "s|value: \"c3d-pool\"|value: \"${PROXY_POOL}\"|" \
              k8s/benchmark-job.yaml | \
            sed "/BENCH_DURATION_SEC/{n;s|value: \"30\"|value: \"${{ inputs.duration_sec }}\"|;}" | \
            kubectl apply -f -

          echo "Benchmark job started. Waiting for completion..."

      - name: Wait for Benchmark Completion
        run: |
          # Wait for job to complete (max 45 minutes).
          # K8s 1.35+ uses JobSuccessPolicy which first sets SuccessCriteriaMet
          # before promoting to Complete, so accept either as success.
          kubectl wait --for=condition=complete job/benchmark \
            -n ${{ env.K8S_NAMESPACE }} --timeout=2700s || true

          # Check job status: look for either Complete or SuccessCriteriaMet
          STATUS=$(kubectl get job benchmark -n ${{ env.K8S_NAMESPACE }} \
            -o jsonpath='{range .status.conditions[*]}{.type}{"\n"}{end}' \
            | grep -E '^(Complete|SuccessCriteriaMet|Failed)$' | head -1)
          echo "Job status: $STATUS"

          if [ "$STATUS" != "Complete" ] && [ "$STATUS" != "SuccessCriteriaMet" ]; then
            echo "::error::Benchmark job did not complete successfully (status: $STATUS)"
            kubectl logs job/benchmark -n ${{ env.K8S_NAMESPACE }} --tail=50
            exit 1
          fi
          echo "Benchmark job completed (status: $STATUS)"

      # ---- Collect Results ----
      - name: Collect Benchmark Results
        if: always()
        run: |
          mkdir -p results

          # Get full logs
          kubectl logs job/benchmark -n ${{ env.K8S_NAMESPACE }} > results/benchmark_output.txt 2>&1 || true

          # Extract the JSON report from logs using markers
          python3 << 'PYEOF'
          import sys
          text = open('results/benchmark_output.txt').read()
          start_marker = 'BENCHMARK_JSON_START'
          end_marker = 'BENCHMARK_JSON_END'
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start >= 0 and end >= 0:
              json_text = text[start + len(start_marker):end].strip()
              with open('results/benchmark_report.json', 'w') as f:
                  f.write(json_text)
              print('JSON report extracted successfully')
          else:
              print('WARNING: No JSON markers found in logs')
          PYEOF

          # Show summary from logs
          echo "=== Benchmark Output (tail) ==="
          tail -40 results/benchmark_output.txt || true

      - name: Upload Benchmark Report (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-incluster
          path: results/benchmark_report.json
          if-no-files-found: warn

      - name: Upload Benchmark Output (Log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-output-incluster
          path: results/benchmark_output.txt
          if-no-files-found: warn

      # ---- Summary ----
      - name: Generate Summary
        if: always()
        run: |
          echo "# Performance Benchmark Report (In-Cluster)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Network Path:** Benchmark Pod -> ClusterIP Service -> S3Proxy Pod" >> $GITHUB_STEP_SUMMARY
          echo "**Dataplane:** GKE Dataplane V2 (eBPF/Cilium)" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**S3Proxy Node Pool:** \`${{ inputs.proxy_node_pool }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Concurrency:** ${{ inputs.concurrency }} | **Duration:** ${{ inputs.duration_sec }}s per test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f results/benchmark_report.json ]; then
            echo "## Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Test | Size | Ops | ops/s | p50(ms) | p95(ms) | p99(ms) | max(ms) | Errors |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|-----|-------|---------|---------|---------|---------|--------|" >> $GITHUB_STEP_SUMMARY

            jq -r '.results[] | "| \(.name) | \(.payload_size) | \(.total_ops) | \(.ops_per_sec | . * 10 | round / 10) | \(.p50_ms | . * 10 | round / 10) | \(.p95_ms | . * 10 | round / 10) | \(.p99_ms | . * 10 | round / 10) | \(.max_ms | . * 10 | round / 10) | \(.errors) |"' results/benchmark_report.json >> $GITHUB_STEP_SUMMARY

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## System Metrics" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Test | CPU(%) | Mem Δ(MB) | Peak Mem(MB) | Goroutine Δ | HTTP Δ |" >> $GITHUB_STEP_SUMMARY
            echo "|------|--------|-----------|-------------|------------|--------|" >> $GITHUB_STEP_SUMMARY

            jq -r '.results[] | "| \(.name) | \(.system_metrics.cpu_usage_percent) | \(.system_metrics.memory_delta_mb) | \(.system_metrics.peak_resident_mb | . * 10 | round / 10) | \(.system_metrics.goroutine_delta) | \(.system_metrics.http_requests_delta) |"' results/benchmark_report.json >> $GITHUB_STEP_SUMMARY
          else
            echo "> ⚠️ No benchmark_report.json found. Check logs for errors." >> $GITHUB_STEP_SUMMARY
          fi

      # ---- Cleanup ----
      - name: Cleanup Benchmark Job
        if: always()
        run: |
          kubectl delete job benchmark -n ${{ env.K8S_NAMESPACE }} --ignore-not-found
          kubectl delete pod health-check -n ${{ env.K8S_NAMESPACE }} --ignore-not-found 2>/dev/null || true
