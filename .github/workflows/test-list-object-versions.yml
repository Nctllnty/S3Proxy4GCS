name: "Test ListObjectVersions"

on:
  workflow_dispatch:
    inputs:
      proxy_endpoint:
        description: 'S3 Proxy endpoint URL'
        type: string
        default: 'http://35.185.56.169'
      test_bucket:
        description: 'Test bucket name'
        type: string
        default: 's3proxy-sdk-go-v2-g4'
  pull_request:
    paths:
      - 'sdk_tests/go-v2/**'
      - '.github/workflows/test-list-object-versions.yml'

jobs:
  test-list-object-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run TestListObjectVersions
        working-directory: sdk_tests/go-v2
        env:
          PROXY_ENDPOINT: ${{ github.event.inputs.proxy_endpoint || 'http://35.185.56.169' }}
          GCS_HMAC_ACCESS: ${{ secrets.GCS_HMAC_ACCESS }}
          GCS_HMAC_SECRET: ${{ secrets.GCS_HMAC_SECRET }}
          TEST_BUCKET: ${{ github.event.inputs.test_bucket || 's3proxy-sdk-go-v2-g4' }}
          TEST_PREFIX: sdk-versions-test-${{ github.run_id }}/
        run: go test -v -run TestListObjectVersions -timeout 5m ./...
